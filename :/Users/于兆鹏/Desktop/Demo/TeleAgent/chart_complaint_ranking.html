<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #f5f5f5; }
.container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #333; margin-bottom: 10px; }
.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
#chart { width: 100%; height: 500px; margin-bottom: 30px; }
.info { background: #f8f9fa; padding: 15px; border-radius: 6px; font-size: 13px; color: #555; }
.info strong { color: #333; }
</style>
</head>
<body>
<div class="container">
<h1>2026年5月南昌各套餐投诉量排名</h1>
<div class="subtitle">数据来源：智能数据查询面板 | 模拟数据</div>
<div id="chart"></div>
<div class="info">
<strong>查询摘要：</strong>上月南昌投诉集中在5G畅享套餐(33.6%)，环比增长34.3%<br>
<strong>智能标注：</strong>🔴 5G畅享套餐环比增长34.3%，远超正常波动范围 | ⚠️ IoT物联套餐投诉量显著低于均值<br>
<strong>执行信息：</strong>manager角色 | 数据范围：江西省南昌市 | 数据源：complaint | 耗时：120ms
</div>
</div>
<script>
var chart = echarts.init(document.getElementById('chart'));
var option = {
  tooltip: {
    trigger: 'axis',
    axisPointer: { type: 'shadow' },
    formatter: function(params) {
      var d = params[0];
      return d.name + '<br/>投诉量: ' + d.value + '件<br/>占比: ' + (d.value / 140 * 100).toFixed(1) + '%';
    }
  },
  xAxis: {
    type: 'value',
    name: '投诉量（件）',
    axisLabel: { formatter: '{value}件' }
  },
  yAxis: {
    type: 'category',
    data: ['IoT物联套餐', '政企专线套餐', '宽带融合套餐', '4G飞享套餐', '5G畅享套餐'],
    axisLabel: { fontSize: 12 }
  },
  series: [{
    type: 'bar',
    data: [15, 18, 28, 32, 47],
    itemStyle: {
      color: function(params) {
        var colors = ['#4D96FF', '#6BCB77', '#FFD93D', '#FFA07A', '#FF6B6B'];
        return colors[params.dataIndex];
      },
      borderRadius: [0, 4, 4, 0]
    },
    label: {
      show: true,
      position: 'right',
      formatter: '{c}件'
    }
  }],
  grid: { left: '15%', right: '10%', bottom: '10%', top: '5%' }
};
chart.setOption(option);
window.addEventListener('resize', function() { chart.resize(); });
</script>
</body>
</html>

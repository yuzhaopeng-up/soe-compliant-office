<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小龙虾Skill实战 - Sprint看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overflow-x:auto}
.header{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);padding:20px 32px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:16px}
.project-icon{font-size:28px}
.project-title{font-size:22px;font-weight:700;letter-spacing:0.5px;background:linear-gradient(90deg,#f97316,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.project-sub{font-size:12px;color:#94a3b8;margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-box{position:relative}
.search-box input{background:#1e293b;border:1px solid #475569;border-radius:8px;padding:8px 12px 8px 36px;color:#e2e8f0;font-size:13px;width:200px;outline:none;transition:border .2s}
.search-box input:focus{border-color:#f97316}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);fill:#94a3b8}
.filter-group{display:flex;gap:8px;align-items:center}
.filter-btn{background:#1e293b;border:1px solid #475569;border-radius:8px;padding:6px 14px;color:#94a3b8;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.filter-btn:hover,.filter-btn.active{border-color:#f97316;color:#f97316}
.filter-btn.active{background:#f973161a}
.members-bar{background:#1e293b;padding:10px 32px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.member-chip{display:flex;align-items:center;gap:6px;background:#0f172a;border:1px solid #334155;border-radius:20px;padding:4px 12px 4px 6px;font-size:12px;cursor:pointer;transition:all .2s}
.member-chip:hover,.member-chip.active{border-color:#f97316;background:#f973161a}
.member-chip.active .member-avatar{box-shadow:0 0 0 2px #f97316}
.member-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.board{display:flex;gap:16px;padding:24px 24px 24px;min-height:calc(100vh - 130px);overflow-x:auto}
.column{flex:1;min-width:240px;max-width:320px;display:flex;flex-direction:column;background:#1e293b40;border-radius:12px;border:1px solid #334155}
.col-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155}
.col-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.col-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.col-count{background:#475569;color:#e2e8f0;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;min-width:24px;text-align:center}
.col-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:10px;min-height:100px}
.card{background:#1e293b;border-radius:8px;padding:12px 14px;cursor:grab;border-left:3px solid #475569;transition:all .2s;position:relative}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.3);transform:translateY(-1px)}
.card.dragging{opacity:.4;transform:rotate(2deg)}
.card-title{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4;padding-right:4px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.card-assignee{display:flex;align-items:center;gap:5px;font-size:11px;color:#94a3b8}
.card-assignee .mini-avatar{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.card-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:#47556960;color:#cbd5e1}
.card-size{font-size:10px;padding:2px 6px;border-radius:4px;background:#47556940;color:#94a3b8;font-weight:600}
.priority-urgent{border-left-color:#ef4444}
.priority-high{border-left-color:#f97316}
.priority-medium{border-left-color:#eab308}
.priority-low{border-left-color:#22c55e}
.drop-zone{min-height:40px;border-radius:8px;border:2px dashed transparent;transition:all .2s}
.drop-zone.drag-over{border-color:#f97316;background:#f9731610;min-height:80px}
.empty-hint{color:#475569;font-size:12px;text-align:center;padding:20px 0;font-style:italic}
.tag-skill{background:#7c3aed30;color:#a78bfa}
.tag-5g{background:#0ea5e930;color:#38bdf8}
.tag-security{background:#ef444430;color:#f87171}
.tag-data{background:#22c55e30;color:#4ade80}
.tag-ai{background:#f9731630;color:#fb923c}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="project-icon">🔥</span>
    <div>
      <div class="project-title">小龙虾Skill实战</div>
      <div class="project-sub">Sprint Board · 8只龙虾协作团队</div>
    </div>
  </div>
  <div class="header-right">
    <div class="filter-group">
      <button class="filter-btn" onclick="filterPriority('urgent')">🔴 紧急</button>
      <button class="filter-btn" onclick="filterPriority('high')">🟠 高</button>
      <button class="filter-btn" onclick="filterPriority('medium')">🟡 中</button>
      <button class="filter-btn" onclick="filterPriority('all')" style="color:#94a3b8">全部</button>
    </div>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="搜索任务..." oninput="searchTasks(this.value)">
    </div>
  </div>
</div>

<div class="members-bar" id="membersBar"></div>

<div class="board" id="board"></div>

<script>
const DATA = {
  project: "小龙虾Skill实战",
  columns: ["待办","进行中","审核中","完成","阻塞"],
  colColors: ["#94a3b8","#f97316","#a78bfa","#22c55e","#ef4444"],
  members: [
    {id:"l1",name:"🦞1",role:"策略",color:"#ef4444"},
    {id:"l2",name:"🦞2",role:"分析",color:"#f97316"},
    {id:"l3",name:"🦞3",role:"安全",color:"#a78bfa"},
    {id:"l4",name:"🦞4",role:"审计",color:"#22c55e"},
    {id:"l5",name:"🦞5",role:"诊断",color:"#0ea5e9"},
    {id:"l6",name:"🦞6",role:"数据",color:"#eab308"},
    {id:"l7",name:"🦞7",role:"编排",color:"#ec4899"},
    {id:"l8",name:"🦞8",role:"助手",color:"#6366f1"}
  ],
  tasks: [
    {id:"T01",title:"PPT制作",column:1,priority:"urgent",assignee:"l1",tags:["skill"],size:"L"},
    {id:"T02",title:"H5页面",column:0,priority:"high",assignee:"l8",tags:["skill"],size:"M"},
    {id:"T03",title:"Skill模板开发",column:1,priority:"urgent",assignee:"l2",tags:["skill"],size:"L"},
    {id:"T04",title:"安全审计",column:0,priority:"high",assignee:"l3",tags:["security"],size:"M"},
    {id:"T05",title:"故障诊断",column:0,priority:"high",assignee:"l5",tags:["5g"],size:"M"},
    {id:"T06",title:"数据面板",column:1,priority:"urgent",assignee:"l6",tags:["data"],size:"XL"},
    {id:"T07",title:"Agent团队",column:0,priority:"high",assignee:"l7",tags:["ai"],size:"M"},
    {id:"T08",title:"自动驾驶",column:0,priority:"medium",assignee:"l8",tags:["ai"],size:"S"},
    {id:"T09",title:"自进化",column:0,priority:"medium",assignee:"l8",tags:["ai"],size:"S"}
  ]
};

const tagClass = {skill:"tag-skill","5g":"tag-5g",security:"tag-security",data:"tag-data",ai:"tag-ai"};
const tagLabel = {skill:"Skill","5g":"5G专网",security:"安全",data:"数据",ai:"AI"};
const sizeLabel = {S:"S",M:"M",L:"L",XL:"XL"};
const priorityLabel = {urgent:"🔴紧急",high:"🟠高",medium:"🟡中",low:"🟢低"};

let activeFilter = null;
let activeMember = null;
let searchQuery = "";

function getMember(id){return DATA.members.find(m=>m.id===id)}

function renderMembers(){
  const bar=document.getElementById("membersBar");
  bar.innerHTML=DATA.members.map(m=>
    `<div class="member-chip${activeMember===m.id?' active':''}" onclick="filterMember('${m.id}')">
      <div class="member-avatar" style="background:${m.color}">${m.name.replace('🦞','')}</div>
      <span>${m.role}</span>
    </div>`
  ).join('');
}

function renderBoard(){
  const board=document.getElementById("board");
  board.innerHTML=DATA.columns.map((col,ci)=>{
    const tasks=DATA.tasks.filter(t=>t.column===ci && isVisible(t));
    return `<div class="column">
      <div class="col-header">
        <div class="col-title"><span class="col-dot" style="background:${DATA.colColors[ci]}"></span>${col}</div>
        <span class="col-count">${tasks.length}</span>
      </div>
      <div class="col-body" id="col-${ci}" ondragover="handleDragOver(event)" ondrop="handleDrop(event,${ci})" ondragleave="handleDragLeave(event)">
        ${tasks.length?tasks.map(t=>renderCard(t)).join(''):'<div class="empty-hint">拖拽任务到此处</div>'}
      </div>
    </div>`;
  }).join('');
  updateCounts();
}

function renderCard(t){
  const m=getMember(t.assignee);
  return `<div class="card priority-${t.priority}" draggable="true" id="card-${t.id}"
    ondragstart="handleDragStart(event,'${t.id}')" ondragend="handleDragEnd(event)">
    <div class="card-title">${t.title}</div>
    <div class="card-meta">
      <div class="card-assignee">
        <div class="mini-avatar" style="background:${m?m.color:'#475569'}">${m?m.name.replace('🦞',''):'?'}</div>
        <span>${m?m.role:'—'}</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        ${t.tags.map(tag=>`<span class="card-tag ${tagClass[tag]||''}">${tagLabel[tag]||tag}</span>`).join('')}
        <span class="card-size">${sizeLabel[t.size]||t.size}</span>
      </div>
    </div>
  </div>`;
}

function isVisible(t){
  if(activeFilter&&t.priority!==activeFilter) return false;
  if(activeMember&&t.assignee!==activeMember) return false;
  if(searchQuery&&!t.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
  return true;
}

function updateCounts(){
  DATA.columns.forEach((_,ci)=>{
    const count=DATA.tasks.filter(t=>t.column===ci&&isVisible(t)).length;
    const el=document.querySelector(`#col-${ci}`);
    if(el){
      const countEl=el.previousElementSibling.querySelector('.col-count');
      if(countEl) countEl.textContent=count;
    }
  });
}

let dragId=null;
function handleDragStart(e,id){dragId=id;e.dataTransfer.effectAllowed='move';e.target.classList.add('dragging')}
function handleDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.col-body').forEach(c=>c.classList.remove('drag-over'))}
function handleDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')}
function handleDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function handleDrop(e,ci){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!dragId) return;
  const task=DATA.tasks.find(t=>t.id===dragId);
  if(task){task.column=ci;renderBoard();}
  dragId=null;
}

function filterPriority(p){
  activeFilter=p==='all'?null:p;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(activeFilter) event.target.classList.add('active');
  renderBoard();
}
function filterMember(id){
  activeMember=activeMember===id?null:id;
  renderMembers();renderBoard();
}
function searchTasks(q){searchQuery=q;renderBoard();}

renderMembers();
renderBoard();
</script>
</body>
</html>
